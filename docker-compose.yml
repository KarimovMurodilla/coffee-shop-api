version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coffeeshop-net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coffeeshop-net

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - coffeeshop-net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - coffeeshop-net

  celery_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
    command: celery -A app.infrastructure.celery.worker worker --loglevel=info
    networks:
      - coffeeshop-net

  celery_beat:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
    command: celery -A app.infrastructure.celery.worker beat --loglevel=info
    networks:
      - coffeeshop-net

networks:
  coffeeshop-net:
    driver: bridge

volumes:
  postgres_data:
